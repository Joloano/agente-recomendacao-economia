# Desenvolvimento (carregado automaticamente pelo `docker compose up`):
#   - API com hot reload (código montado do disco) e porta 8000 exposta
#   - banco exposto em 127.0.0.1:55432 (PORTA_DB) para ferramentas locais
#   - Mailpit para ver os e-mails enviados: http://localhost:8025
#   - pgAdmin opcional: docker compose --profile dev up  →  http://localhost:5050
# Hot reload do frontend: rode `npm start` em frontend/ (o proxy aponta para a API em :8000).

services:
  db:
    ports:
      - "127.0.0.1:${PORTA_DB:-55432}:5432"

  api:
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/app
      - --proxy-headers
      - --forwarded-allow-ips=${SUBREDE_INTERNA:-172.29.213.0/24}
    volumes:
      - ./backend/app:/app/app:ro
    environment:
      SMTP_HOST: mailpit
      SMTP_PORTA: "1025"
    ports:
      - "127.0.0.1:${PORTA_API:-8000}:8000"

  mailpit:
    image: axllent/mailpit:v1.34@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports:
      - "127.0.0.1:${PORTA_MAILPIT:-8025}:8025"
    networks: [interna]

  # Modo desktop (sem login próprio): por isso só escuta em 127.0.0.1.
  pgadmin:
    image: dpage/pgadmin4:9@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    profiles: [dev]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-dev@exemplo.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_SENHA:-somente-local}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PORTA_PGADMIN:-5050}:80"
    depends_on:
      db: { condition: service_healthy }
    networks: [interna]
