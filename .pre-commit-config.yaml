default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # tsconfig e configurações do VS Code são JSONC (aceitam comentários)
        exclude: (^|/)(tsconfig[^/]*\.json|\.vscode/.*)$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  # O código em legado/ é a entrega acadêmica original e fica fora do lint de propósito.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/app/
        args: [--config-file=backend/pyproject.toml]
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - fastapi>=0.115
          - sqlalchemy>=2.0.36
          - pyjwt>=2.10
          - argon2-cffi>=23.1
          - email-validator>=2.2
          - jinja2>=3.1.4

  # Prettier e ESLint usam as versões do package-lock do frontend (as mesmas do CI e do editor).
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write --ignore-unknown "${@#frontend/}"' --
        language: system
        files: ^frontend/src/
      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint --
        language: system
        files: ^frontend/src/.*\.(ts|html)$
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, refactor, test, build, ci, chore, perf]
