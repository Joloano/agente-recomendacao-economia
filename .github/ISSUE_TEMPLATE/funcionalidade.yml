name: Funcionalidade
description: Propor uma nova funcionalidade ou melhoria
labels: ["enhancement"]
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Qual problema do usuário isto resolve?
    validations:
      required: true
  - type: textarea
    id: tarefas
    attributes:
      label: Tarefas
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      description: Como saberemos que está pronto?
    validations:
      required: true
  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade sugerida
      options: [Alta, Média, Baixa]
