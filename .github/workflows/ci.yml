name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  mudancas:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      frontend: ${{ steps.filtro.outputs.frontend }}
      docker: ${{ steps.filtro.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filtro
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.env.example'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - '**/Dockerfile'
              - 'docker-compose*.yml'
              - 'backend/**'
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  pre-commit:
    name: Verificações gerais (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        env:
          # Hooks que dependem do node_modules do frontend rodam no job do frontend.
          SKIP: eslint,prettier,conventional-pre-commit

  backend:
    name: Backend (lint, tipos e testes)
    needs: mudancas
    if: needs.mudancas.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agente_teste
          POSTGRES_USER: agente
          POSTGRES_PASSWORD: agente
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agente"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AMBIENTE: teste
      POSTGRES_HOST: localhost
      POSTGRES_DB: agente_teste
      POSTGRES_USUARIO: agente
      POSTGRES_SENHA: agente
      TESTE_BANCO_URL: postgresql+psycopg://agente:agente@localhost:5432/agente_teste
    steps:
      - uses: actions/checkout@v7
      - name: Verificar projeto Python
        id: existe
        run: test -f pyproject.toml && echo "sim=true" >> "$GITHUB_OUTPUT" || echo "sim=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.existe.outputs.sim == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - if: steps.existe.outputs.sim == 'true'
        run: pip install -e ".[dev]"
      - name: Lockfile em dia com o pyproject
        if: steps.existe.outputs.sim == 'true'
        run: |
          pip install uv
          uv pip compile pyproject.toml --generate-hashes --python-version 3.12             --python-platform x86_64-unknown-linux-gnu -q -o requirements-lock.txt             --custom-compile-command "$(sed -n '2s/^#    //p' requirements-lock.txt)"
          git diff --exit-code requirements-lock.txt || {
            echo "::error::requirements-lock.txt desatualizado; rode o comando do cabeçalho do arquivo"; exit 1; }
      - name: Lint
        if: steps.existe.outputs.sim == 'true'
        run: ruff check . --output-format=github
      - name: Formatação
        if: steps.existe.outputs.sim == 'true'
        run: ruff format --check .
      - name: Tipos
        if: steps.existe.outputs.sim == 'true'
        run: mypy app tests
      - name: Testes
        if: steps.existe.outputs.sim == 'true'
        run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always() && steps.existe.outputs.sim == 'true'
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, testes e build)
    needs: mudancas
    if: needs.mudancas.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Verificar projeto Angular
        id: existe
        run: test -f package.json && echo "sim=true" >> "$GITHUB_OUTPUT" || echo "sim=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.existe.outputs.sim == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.existe.outputs.sim == 'true'
        run: npm ci
      - if: steps.existe.outputs.sim == 'true'
        run: npm run lint
      - if: steps.existe.outputs.sim == 'true'
        run: npx prettier --check src
      - if: steps.existe.outputs.sim == 'true'
        run: npm test -- --watch=false
      - if: steps.existe.outputs.sim == 'true'
        run: npx ng build --configuration production

  docker:
    name: Build das imagens Docker
    needs: mudancas
    if: needs.mudancas.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Verificar Dockerfile
        id: existe
        run: test -f ${{ matrix.servico }}/Dockerfile && echo "sim=true" >> "$GITHUB_OUTPUT" || echo "sim=false" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        if: steps.existe.outputs.sim == 'true'
      - uses: docker/build-push-action@v7
        if: steps.existe.outputs.sim == 'true'
        with:
          context: ${{ matrix.servico }}
          push: false
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}

  ci-ok:
    name: CI concluído
    if: always()
    needs: [mudancas, pre-commit, backend, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Falha se algum job falhou
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Todos os jobs necessários passaram ou foram pulados por não haver mudanças."
