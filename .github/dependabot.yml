version: 2
updates:
  # Digest da imagem base do Python (correções de segurança do SO)
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
  # Dependências Python (pyproject + requirements.lock)
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
    groups:
      python:
        patterns: ["*"]
  # Imagens do frontend (Node e nginx) e do compose (Postgres, Mailpit)
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
  # Dependências do Angular, agrupadas para atualizar juntas
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "typescript"]
      demais:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
