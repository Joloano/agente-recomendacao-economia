version: 2
updates:
  # Digest da imagem base do Python (correções de segurança do SO)
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
  # Dependências Python (pyproject + requirements.lock)
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
