version: 2
updates:
  # Digest da imagem base do Python (correções de segurança do SO)
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
  # Dependências Python (pyproject + requirements.lock)
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  # Imagens do frontend (Node e nginx) e do compose (Postgres, Mailpit)
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
    ignore:
      # Versão maior do Postgres muda o formato dos dados (pg_upgrade): só com plano e backup.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  # Dependências do Angular, agrupadas para atualizar juntas
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
    groups:
      # Majors do Angular exigem `ng update`: ficam em PR próprio, fora dos grupos.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "typescript"]
        update-types: [minor, patch]
      demais:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # O TypeScript acompanha a versão suportada pelo Angular; sobe junto com o `ng update`.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
