{# Botão grande e clicável no celular (área de toque ≥ 44 px), com o link também em texto. #}
<table role="presentation" cellspacing="0" cellpadding="0" style="margin:24px 0;">
  <tr>
    <td style="border-radius:24px;background:#0061a4;">
      <a href="{{ link }}" style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:500;color:#ffffff;text-decoration:none;border-radius:24px;">{{ rotulo }}</a>
    </td>
  </tr>
</table>
<p style="font-size:13px;color:#5f6168;">Se o botão não funcionar, copie este endereço no navegador:<br>
<a href="{{ link }}" style="color:#0061a4;word-break:break-all;">{{ link }}</a></p>
